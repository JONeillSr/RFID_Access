; =============================================================================
;  PlatformIO Project Configuration — RFID Access Control
;  Multi-board: ESP32-C3, ESP32-C6, ESP32-S3, classic ESP32
;
;  Reusable Display + SplashScreen + WiFiManager libraries live in lib/ and are
;  picked up automatically by the Library Dependency Finder.
;
;  pioarduino fork of the platform is used for current ESP32-C6 support.
; =============================================================================

[platformio]
default_envs = seeed_xiao_esp32c6
src_dir = src

; -----------------------------------------------------------------------------
;  Shared options inherited by every environment.
; -----------------------------------------------------------------------------
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    ayushsharma82/ElegantOTA@^3
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit BusIO@^1.16.1

; Shared partition table for every board: min_spiffs' 128 KB filesystem is too
; small for the credential roster plus a useful event spool. partitions_rfid.csv
; takes 64 KB off each OTA app slot to double the filesystem to 256 KB, and
; deliberately keeps nvs/otadata at min_spiffs' exact offsets so existing units
; keep their enrolled fobs, WiFi credentials and unlock schedule across the
; change. See the header of that file, and tools/check_partitions.py to verify.
;
; NOTE: a partition-table change cannot be delivered over OTA (OTA writes only
; the inactive app slot). Every unit needs one USB flash for this.
board_build.partitions = partitions_rfid.csv

; LittleFS rather than SPIFFS: it tolerates power loss far better, which matters
; for an append-only event spool on a device that can lose power at any moment.
board_build.filesystem = littlefs

build_flags =
    -Wall
    -D CORE_DEBUG_LEVEL=3
    ; ElegantOTA defaults to ESPAsyncWebServer; we use the sync WebServer, so
    ; force sync mode or the OTA layer won't compile.
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=0
    ; Firmware version, reported on /status and in the boot banner. Phase 4's
    ; central rollout compares this against the version the backend offers, so
    ; it MUST be bumped whenever behaviour changes -- two different builds
    ; reporting the same version makes a fleet impossible to reason about.
    ;   1.x    single-door firmware (pre-identity)
    ;   2.0.0  runtime identity, partitions_rfid, LittleFS
    ;   2.1.0  LittleFS-backed Roster + migration off the NVS allow-list
    ;   2.1.1  /status reports roster file size (persistence proof)
    ;   2.2.0  durable EventLog spool (taps, exit, schedule, boot)
    ;   2.2.1  fix: Events line was missing from /status
    -D FW_VERSION=\"2.2.1\"

; -----------------------------------------------------------------------------
;  Seeed XIAO ESP32-C6 (primary target)
;  Partition table and filesystem are shared by every env; see [env] above.
; -----------------------------------------------------------------------------
[env:seeed_xiao_esp32c6]
board = seeed_xiao_esp32c6
build_flags =
    ${env.build_flags}
    -D BOARD_XIAO_ESP32C6
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; -----------------------------------------------------------------------------
;  ESP32-C3 generic
; -----------------------------------------------------------------------------
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D BOARD_ESP32C3

; -----------------------------------------------------------------------------
;  ESP32-S3 generic
; -----------------------------------------------------------------------------
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D BOARD_ESP32S3

; -----------------------------------------------------------------------------
;  Classic ESP32 (WROOM)
; -----------------------------------------------------------------------------
[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D BOARD_ESP32DEV
